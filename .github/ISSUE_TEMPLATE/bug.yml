name: Bug
description: Something in the app does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a generated scene with unsuitable content, use the **Unsuitable scene** template.

        Before opening: some odd-looking behaviour is deliberate and explained in
        [docs/decisions.md](https://github.com/rodrigobastosv/conta-comigo/blob/main/docs/decisions.md)
        — for example, there is no narration yet.

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Node 22.13, Chrome 140, macOS 15"

  - type: textarea
    id: logs
    attributes:
      label: Console error
      description: From the browser and from the `npm run dev` terminal, if any.
      render: shell

  - type: checkboxes
    id: supabase
    attributes:
      label: Configuration
      options:
        - label: I am running without the Supabase variables (everything in memory)
