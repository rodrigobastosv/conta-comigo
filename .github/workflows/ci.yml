name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 22.6+ pelo --experimental-strip-types que o npm test usa.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # Não precisa de ANTHROPIC_API_KEY: o cliente só é construído em runtime.
      - name: Build
        run: npm run build
